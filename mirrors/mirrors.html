<!DOCTYPE html>
<html>
    <head>
        <style>
            html{
                background: rgb(83, 83, 83);
            }
            body{
                display: flex;
                flex-direction: column;
            }
            body>*:not(:first-child){
                margin-top: 5px;
            }
            body>*:last-child{
                border-radius: 25px;
                border-top-left-radius: 0;
                border-top-right-radius: 0;
            }
            body:has(a:hover, a:focus-visible)>a:not(:hover, :focus-visible){
                background: rgb(32, 32, 32);
            }
            h1{
                border-radius: 25px;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                margin-bottom: 17px;
                background: rgb(46, 46, 46);
                padding: 10px;
                color: white;
                margin: 0;
            }
            h1>p:before{
                content: " ";
                color: transparent;
                margin: 3px;
                width: 25px;
            }
            h1>p{
                display: contents;
                font-size: 0.5em;
            }
            h1>p>a, h1>p>a:focus-visible{
                all: unset;
            }
            h1>p>a:hover{
                all: unset;
                cursor: pointer;
            }

            a{
                transition: 0.2s;
                background: rgb(63, 63, 63);
                padding: 15px;
                color: white;
                border-left: rgb(63, 63, 63) solid 0px;
            }
            a:hover, a:focus-visible{
                border-left: rgb(110, 110, 110) 25px solid;
                outline: rgb(255, 255, 255) 1px solid !important;
            }
            a.notassigned{
                display: flex;
                flex-direction: column;
                padding-bottom: 5px;
            }
            a.notassigned:hover, a.notassigned:focus-visible{
                border-left: rgb(192, 62, 62) 25px solid;
                outline: rgb(255, 108, 108) 1px solid !important;
            }
            a.notassigned:before{
                transition: 0.2s;
                content: "Not Assigned!";
                background: rgb(221, 84, 84);
                margin: -15px;
                padding: 15px;
                padding-top: 1px;
                padding-bottom: 1px;
                margin-bottom: 5px;
            }
            body:has(a:hover, a:focus-visible)>a:not(:hover, :focus-visible).notassigned:before{
                background: rgb(165, 62, 62);
            }

            a.here:before{
                transition: 0.2s;
                content: "You are Here";
                background: rgb(84, 86, 221);
                margin: -15px;
                padding: 16px;
                margin-right: 15px;
            }
            body:has(a:hover, a:focus-visible)>a:not(:hover, :focus-visible).here:before{
                background: rgb(55, 57, 145);
            }

            a.experimental{
                display: flex;
                flex-direction: column;
                padding-bottom: 5px;
            }
            a.experimental:hover, a.experimental:focus-visible{
                border-left: rgb(64, 62, 192) 25px solid;
                outline: rgb(102, 100, 236) 1px solid !important;
            }
            a.experimental:before{
                transition: 0.2s;
                content: "Experimental";
                background: rgb(102, 100, 236);
                margin: -15px;
                padding: 15px;
                padding-top: 1px;
                padding-bottom: 1px;
                margin-bottom: 5px;
            }
            body:has(a:hover, a:focus-visible)>a:not(:hover, :focus-visible).experimental:before{
                background: rgb(60, 59, 138);
            }
            
            a.othersite{
                display: flex;
                flex-direction: column;
                padding-bottom: 5px;
            }
            a.othersite:hover, a.othersite:focus-visible{
                border-left: rgb(54, 128, 58) 25px solid;
                outline: rgb(70, 163, 74) 1px solid !important;
            }
            a.othersite:before{
                transition: 0.2s;
                content: "Other site";
                background: rgb(70, 163, 74);
                margin: -15px;
                padding: 15px;
                padding-top: 1px;
                padding-bottom: 1px;
                margin-bottom: 5px;
            }
            body:has(a:hover, a:focus-visible)>a:not(:hover, :focus-visible).othersite:before{
                background: rgb(52, 121, 55);
            }
        </style>
    </head>
    <body>
        <h1>xns-internet-surfer Mirrors<p><a href="egg">v1.00</a></p></h1>
        <a class="notassigned" href="https://xns-internet-surfer.neocities.org/">NeoCities</a>
        <a class="notassigned" href="https://xns-internet-surfer.nekoweb.org/">NekoWeb</a>
        <a class="experimental" href="https://xns-internet-surfer.github.io/">Github</a>
        <a class="othersite" href="https://status.cafe/users/xns-internet-surfer">Status Cafe</a>
    </body>
</html>
